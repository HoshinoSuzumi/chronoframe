name: Workspace checks
on:
  pull_request:
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'Dockerfile'
      - '.dockerignore'
      - '.npmrc'
      - '**/tsconfig.json'
      - '.github/workflows/workspace-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  self-hosted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.3
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:packages
      - run: pnpm lint
      - run: pnpm test
        timeout-minutes: 10
      - run: pnpm build:deps
      - run: pnpm build
      - run: pnpm test:album-http

  edge:
    env:
      WRANGLER_SEND_METRICS: 'false'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        entry: [cloud, site]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.3
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:entries
      - run: pnpm build:deps
      - run: pnpm build:${{ matrix.entry }}
      - run: node scripts/check-entry-boundaries.mjs --built ${{ matrix.entry }}
      - run: pnpm exec wrangler deploy --dry-run --config apps/${{ matrix.entry }}/.output/server/wrangler.json --outdir /tmp/chronoframe-${{ matrix.entry }}-worker
      - run: pnpm smoke:${{ matrix.entry }}
      - name: Check marketing and portal Host routing
        if: matrix.entry == 'cloud'
        run: |
          CHRONOFRAME_SMOKE_HOST=chronoframe.art pnpm smoke:cloud
          CHRONOFRAME_SMOKE_HOST=app.chronoframe.art pnpm smoke:cloud
