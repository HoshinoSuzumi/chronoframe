name: Publish Images

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      branch:
        description: Release source branch (version commit will be pushed here)
        type: string
        required: true
      version:
        description: SemVer release version, with or without the v prefix
        type: string
        required: true
      publish_ghcr:
        description: Publish to GitHub Container Registry
        type: boolean
        default: true
      publish_dockerhub:
        description: Publish to Docker Hub
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: publish-images
  cancel-in-progress: false

env:
  GHCR_REGISTRY: ghcr.io
  GHCR_IMAGE_NAME: ${{ github.repository }}
  DOCKERHUB_IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}
  TARGET_ARCHITECTURES: amd64 arm64

jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      commit: ${{ steps.source.outputs.commit }}
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.trigger.outputs.publish }}
    steps:
      - name: Validate manual release credential
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [[ -z "$RELEASE_TOKEN" ]]; then
            echo "::error::Configure RELEASE_TOKEN with repository Contents read/write and an administrator identity allowed to bypass branch and release-tag rules."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/heads/{0}', inputs.branch) || github.ref }}
          fetch-depth: 0
          fetch-tags: true
          token: ${{ github.event_name == 'workflow_dispatch' && secrets.RELEASE_TOKEN || github.token }}

      - name: Select publishing run
        id: trigger
        env:
          RELEASE_EVENT: ${{ github.event_name }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          import { execFileSync } from 'node:child_process'
          const git = (...args) => execFileSync('git', args, { encoding: 'utf8' }).trim()
          let owner
          if (process.env.RELEASE_EVENT === 'push' && git('cat-file', '-t', process.env.GITHUB_REF) === 'tag') {
            owner = git('for-each-ref', '--format=%(contents)', process.env.GITHUB_REF)
              .match(/^ChronoFrame-Publish-Images-Run: ([0-9]+)$/m)?.[1]
          }
          if (process.env.RELEASE_EVENT === 'workflow_dispatch' && !fs.readFileSync('.github/workflows/publish-images.yml', 'utf8').includes('ChronoFrame-Publish-Images-Run:')) {
            throw new Error('The release source branch must include the current publication workflow; backport it before releasing this branch.')
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `publish=${!owner}\n`)
          if (owner) {
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `Publishing is owned by the [manual release run](https://github.com/${process.env.GITHUB_REPOSITORY}/actions/runs/${owner}); this tag-triggered duplicate is skipped.\n`)
          }
          NODE

      - name: Validate release version and targets
        id: version
        if: steps.trigger.outputs.publish == 'true'
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_BRANCH: ${{ inputs.branch }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
          PUBLISH_GHCR: ${{ inputs.publish_ghcr }}
          PUBLISH_DOCKERHUB: ${{ inputs.publish_dockerhub }}
        run: |
          set -euo pipefail
          if [[ "$MANUAL" == true ]]; then
            git check-ref-format "refs/heads/$RELEASE_BRANCH"
            if [[ "$PUBLISH_GHCR" != true && "$PUBLISH_DOCKERHUB" != true ]]; then
              echo "::error::Select at least one registry."
              exit 1
            fi
          else
            RELEASE_VERSION="$GITHUB_REF_NAME"
          fi
          export RELEASE_VERSION
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const version = process.env.RELEASE_VERSION.replace(/^v/, '')
          const regex = /^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-(?:0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*)?$/
          // Build metadata contains '+', which is not valid in Docker tags.
          if (!regex.test(version) || /\s/.test(version) || version.length > 121) throw new Error('Expected Docker-compatible SemVer without build metadata, at most 121 characters')
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\ntag=v${version}\nprerelease=${version.includes('-')}\n`)
          NODE

      - name: Commit version and create release tag
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_BRANCH: ${{ inputs.branch }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          import { execFileSync, spawnSync } from 'node:child_process'
          const git = (...args) => execFileSync('git', args, { encoding: 'utf8', stdio: ['ignore', 'pipe', 'inherit'] }).trim()
          const { RELEASE_VERSION: version, RELEASE_TAG: tag, RELEASE_BRANCH: branch, GITHUB_RUN_ID: runId } = process.env
          if (!/^[0-9]+$/.test(runId)) throw new Error('Invalid release run ID')
          const ref = `refs/tags/${tag}`
          const marker = `ChronoFrame-Publish-Images-Run: ${runId}`
          const exists = spawnSync('git', ['show-ref', '--verify', '--quiet', ref]).status
          if (exists === 0) {
            const owned = git('cat-file', '-t', ref) === 'tag' && git('for-each-ref', '--format=%(contents)', ref).split('\n').includes(marker)
            if (!owned) throw new Error('Release tag already exists; refusing to overwrite.')
            const pkg = JSON.parse(git('show', `${ref}:package.json`))
            if (pkg.version !== version) throw new Error('Existing release tag has a different version')
            git('checkout', '--detach', `${ref}^{commit}`)
            console.log(`Resuming ${tag} at its original immutable commit`)
          } else {
            if (exists !== 1) throw new Error('Unable to inspect release tag')
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'))
            pkg.version = version
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n')
            git('config', 'user.name', 'HoshinoSuzumi')
            git('config', 'user.email', '26276464+HoshinoSuzumi@users.noreply.github.com')
            git('add', '--', 'package.json')
            const changed = spawnSync('git', ['diff', '--cached', '--quiet']).status
            if (changed === 1) git('commit', '-m', `chore(release): ${tag}`)
            else if (changed !== 0) throw new Error('Unable to inspect version changes')
            git('tag', '-a', tag, '-m', `Release ${tag}`, '-m', marker)
            // Reject concurrent branch updates without leaving a partial release tag.
            git('push', '--atomic', 'origin', `HEAD:refs/heads/${branch}`, ref)
          }
          NODE

      - name: Resolve immutable release commit
        id: source
        if: steps.trigger.outputs.publish == 'true'
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build-and-push:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH_GHCR: ${{ github.event_name == 'push' || inputs.publish_ghcr }}
      PUBLISH_DOCKERHUB: ${{ github.event_name == 'push' || inputs.publish_dockerhub }}
      VERSION: ${{ needs.prepare.outputs.version }}
      IS_PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' || inputs.publish_ghcr
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: github.event_name == 'push' || inputs.publish_dockerhub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image (${{ matrix.arch }})
        run: |
          set -euo pipefail
          GHCR_BASE_RAW="${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}"
          DOCKERHUB_BASE_RAW="${{ env.DOCKERHUB_IMAGE_NAME }}"
          GHCR_BASE=$(echo "$GHCR_BASE_RAW" | tr '[:upper:]' '[:lower:]')
          DOCKERHUB_BASE=$(echo "$DOCKERHUB_BASE_RAW" | tr '[:upper:]' '[:lower:]')
          ARCH="${{ matrix.arch }}"

          images=()
          [[ "$PUBLISH_GHCR" == true ]] && images+=("$GHCR_BASE")
          [[ "$PUBLISH_DOCKERHUB" == true ]] && images+=("$DOCKERHUB_BASE")
          tags=()
          for image in "${images[@]}"; do
            tags+=(--tag "${image}:${VERSION}-${ARCH}")
          done
          docker build "${tags[@]}" .
          for image in "${images[@]}"; do
            docker push "${image}:${VERSION}-${ARCH}"
            docker tag "${image}:${VERSION}-${ARCH}" "${image}:nightly-${ARCH}"
            docker push "${image}:nightly-${ARCH}"
            if [[ "$IS_PRERELEASE" != true ]]; then
              docker tag "${image}:${VERSION}-${ARCH}" "${image}:latest-${ARCH}"
              docker push "${image}:latest-${ARCH}"
            fi
          done

  manifest:
    needs:
      - prepare
      - build-and-push
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH_GHCR: ${{ github.event_name == 'push' || inputs.publish_ghcr }}
      PUBLISH_DOCKERHUB: ${{ github.event_name == 'push' || inputs.publish_dockerhub }}
      VERSION: ${{ needs.prepare.outputs.version }}
      IS_PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
    steps:
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' || inputs.publish_ghcr
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: github.event_name == 'push' || inputs.publish_dockerhub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish multi-architecture manifests
        env:
          SOURCE_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          set -euo pipefail
          GHCR_BASE_RAW="${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}"
          DOCKERHUB_BASE_RAW="${{ env.DOCKERHUB_IMAGE_NAME }}"
          GHCR_BASE=$(echo "$GHCR_BASE_RAW" | tr '[:upper:]' '[:lower:]')
          DOCKERHUB_BASE=$(echo "$DOCKERHUB_BASE_RAW" | tr '[:upper:]' '[:lower:]')
          ARCHITECTURES=( $TARGET_ARCHITECTURES )

          create_and_push_manifest() {
            local registry_base=$1
            local tag=$2
            local refs=()
            for arch in "${ARCHITECTURES[@]}"; do
              refs+=("${registry_base}:${tag}-${arch}")
            done
            if docker manifest inspect "${registry_base}:${tag}" > /dev/null 2>&1; then
              docker manifest create --amend "${registry_base}:${tag}" "${refs[@]}"
            else
              docker manifest create "${registry_base}:${tag}" "${refs[@]}"
            fi
            docker manifest push "${registry_base}:${tag}"
          }

          # Public Docker Hub namespaces may also be configured as secrets.
          # Preserve the existing summary display without disclosing credentials.
          display_image() {
            local image="$1" owner prefix=""
            if [[ "$image" == ghcr.io/* ]]; then
              prefix="ghcr.io/"
              image="${image#ghcr.io/}"
            fi
            owner="${image%%/*}"
            local midpoint=$(( (${#owner} + 1) / 2 ))
            printf '%s%s<wbr>%s/%s' "$prefix" "${owner:0:midpoint}" "${owner:midpoint}" "${image#*/}"
          }
          images=()
          [[ "$PUBLISH_GHCR" == true ]] && images+=("$GHCR_BASE")
          [[ "$PUBLISH_DOCKERHUB" == true ]] && images+=("$DOCKERHUB_BASE")
          echo "## Published release images" >> "$GITHUB_STEP_SUMMARY"
          echo "Source: $SOURCE_COMMIT" >> "$GITHUB_STEP_SUMMARY"
          for image in "${images[@]}"; do
            for tag in "$VERSION" nightly; do
              create_and_push_manifest "$image" "$tag"
              echo "- <code>$(display_image "$image"):$tag</code>" >> "$GITHUB_STEP_SUMMARY"
            done
            if [[ "$IS_PRERELEASE" != true ]]; then
              create_and_push_manifest "$image" latest
              echo "- <code>$(display_image "$image"):latest</code>" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

  release:
    needs:
      - prepare
      - manifest
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      PUBLISH_GHCR: ${{ github.event_name == 'push' || inputs.publish_ghcr }}
      PUBLISH_DOCKERHUB: ${{ github.event_name == 'push' || inputs.publish_dockerhub }}
      VERSION: ${{ needs.prepare.outputs.version }}
      IS_PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
    steps:
      - name: Checkout immutable release source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: 📝 Generate changelog
        id: changelog
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_NOTES_FILE: ${{ runner.temp }}/release-notes.md
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          IS_PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          set -euo pipefail
          echo "Generating changelog..."

          echo "All tags:"
          git tag -l --sort=-version:refname

          PREVIOUS_TAG=""
          while IFS= read -r candidate; do
            [[ "$candidate" == "$RELEASE_TAG" ]] && continue
            if [[ "$IS_PRERELEASE" != true && "$candidate" == *-* ]]; then continue; fi
            if git merge-base --is-ancestor "$candidate" HEAD; then
              PREVIOUS_TAG="$candidate"
              break
            fi
          done < <(git tag -l 'v*' --sort=-version:refname)

          echo "Previous tag: $PREVIOUS_TAG"

          if [ -n "$PREVIOUS_TAG" ]; then
            echo "Generating changelog from $PREVIOUS_TAG to current"
            changelog=$(npx @uniiem/changelogen@0.7.2 --from="$PREVIOUS_TAG" --no-output --noMerges --noAuthors)
            contributors=$(node scripts/changelog-contributors.mjs "$PREVIOUS_TAG..HEAD")
          else
            echo "No previous tag found, generating full changelog"
            changelog=$(npx @uniiem/changelogen@0.7.2 --no-output --noMerges --noAuthors)
            contributors=$(node scripts/changelog-contributors.mjs HEAD)
          fi

          changelog=$(echo "$changelog" | sed 's/^\[log\][[:space:]]*//')
          changelog="$changelog
          $contributors"

          if [[ -z "$(printf '%s' "$changelog" | tr -d '[:space:]')" ]]; then
            echo "::error::Generated release notes are empty."
            exit 1
          fi
          printf '%s\n' "$changelog" > "$RELEASE_NOTES_FILE"

      - name: 📝 Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ needs.prepare.outputs.commit }}
          name: Release v${{ env.VERSION }}
          body_path: ${{ runner.temp }}/release-notes.md
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}
          draft: true
