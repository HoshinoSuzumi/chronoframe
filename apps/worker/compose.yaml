services:
  worker:
    build:
      context: ../..
      dockerfile: apps/worker/Dockerfile
    env_file:
      - ${CHRONOFRAME_WORKER_ENV_FILE:?Set the path to the generated worker.env}
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=768m,mode=1777
    mem_limit: 2g
    cpus: 2
    pids_limit: 128
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 210s
